name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lock-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Resolve current phenix-ai lock
        run: |
          nix flake update phenix-ai
          echo '---PHENIX_LOCK_BEGIN---'
          cat flake.lock
          echo '---PHENIX_LOCK_END---'
