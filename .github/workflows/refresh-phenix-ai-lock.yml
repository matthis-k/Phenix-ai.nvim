name: Refresh phenix-ai lock

on:
  push:
    branches:
      - chore/update-phenix-ai-execution-allocation

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/update-phenix-ai-execution-allocation
      - uses: cachix/install-nix-action@v31
      - name: Refresh lock
        run: nix flake lock --update-input phenix-ai
      - name: Commit lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: update phenix-ai lock"
          git push origin HEAD:chore/update-phenix-ai-execution-allocation
