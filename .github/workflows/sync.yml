name: Sync canonical Phenix AI.nvim mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phenix-ai-nvim-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CONDUCTOR_REV: f04a811d464136bf31c070c2a30dc62401daeafc
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Materialize and verify canonical export
        shell: bash
        run: |
          set -euo pipefail

          export_path="$(nix build --no-link --print-out-paths "github:matthis-k/phenix-conductor/$CONDUCTOR_REV#phenix-nvim-export")"

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +
          cp -R "$export_path"/. .
          chmod -R u+w .

          test "$(cat .phenix-conductor-revision)" = "$CONDUCTOR_REV"

          hash_tree() {
            local root="$1"
            (
              cd "$root"
              find . -type f \
                ! -path './.git/*' \
                ! -path './.github/*' \
                -print0 \
                | sort -z \
                | while IFS= read -r -d '' file; do
                    printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$file"
                  done
            )
          }

          hash_tree "$export_path" > "$RUNNER_TEMP/export.sha256"
          hash_tree . > "$RUNNER_TEMP/mirror.sha256"
          cmp "$RUNNER_TEMP/export.sha256" "$RUNNER_TEMP/mirror.sha256"

          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync canonical Phenix AI.nvim mirror"
          git push
